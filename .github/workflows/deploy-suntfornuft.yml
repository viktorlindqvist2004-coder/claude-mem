name: Deploy Sunt Förnuft

on:
  push:
    branches:
      - main
    paths:
      - "website/suntfornuft/**"
      - ".github/workflows/deploy-suntfornuft.yml"
  workflow_dispatch:

jobs:
  deploy-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy
        run: |
          curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
